site_name: Oculifelis's Mods
site_description: Guides for Oculifelis's Minecraft mods
site_author: Oculifelis
copyright: Made by Oculifelis
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  # Solarized Dark is the default; the toggle switches to Solarized Light. Colours are in stylesheets/extra.css.
  palette:
    - scheme: solarized-dark
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Solarized Light}
    - scheme: solarized-light
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Solarized Dark}
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
